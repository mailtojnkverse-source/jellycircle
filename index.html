<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>JC Teambase</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2750%27%20fill%3D%27%23FFF5E6%27%2F%3E%3Ctext%20x%3D%2750%27%20y%3D%2762%27%20text-anchor%3D%27middle%27%20font-family%3D%27Georgia%2Cserif%27%20font-style%3D%27italic%27%20font-weight%3D%27bold%27%20font-size%3D%2738%27%20fill%3D%27%23E8637A%27%3Ejc%3C%2Ftext%3E%3C%2Fsvg%3E"/>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:#0D1117;color:#F0EDE8;min-height:100vh}
.mono{font-family:'Space Mono',monospace}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#1B6E3C}

@-webkit-keyframes fadeUp{from{opacity:0;-webkit-transform:translateY(10px)}to{opacity:1;-webkit-transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@-webkit-keyframes marquee{0%{-webkit-transform:translateX(0)}100%{-webkit-transform:translateX(-50%)}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pdot{0%,100%{box-shadow:0 0 0 0 rgba(255,61,139,.7)}50%{box-shadow:0 0 0 4px rgba(255,61,139,0)}}

.fade-up{-webkit-animation:fadeUp .3s ease both;animation:fadeUp .3s ease both}
.spinner{-webkit-animation:spin 1s linear infinite;animation:spin 1s linear infinite;width:30px;height:30px;border:3px solid #1B6E3C;border-top-color:#FFE600;border-radius:50%}

/* Layout */
.app-wrap{display:-webkit-flex;display:flex;min-height:100vh}
.sidebar{width:220px;min-width:220px;background:#0D1117;border-right:2px solid #1B6E3C;min-height:100vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.main-col{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0;overflow:hidden}
.main-scroll{-webkit-flex:1;flex:1;overflow-y:auto;overflow-x:hidden}
.page{padding:24px;max-width:1100px;margin:0 auto}

/* Nav */
.nav-btn{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:10px;padding:10px 12px;border:none;cursor:pointer;text-align:left;width:100%;background:transparent;-webkit-transition:all .15s;transition:all .15s;border-left:3px solid transparent;margin-bottom:2px;font-family:'Space Grotesk',sans-serif}
.nav-btn:hover{background:rgba(27,110,60,.2);border-left-color:#2EA55A}
.nav-btn.active{background:rgba(255,230,0,.08);border-left:3px solid #FFE600}

/* Cards */
.card{background:#161B22;border:1px solid #1B6E3C}
.task-card{background:#161B22;border:1px solid #1B6E3C;cursor:pointer;-webkit-transition:all .15s;transition:all .15s}
.task-card:hover{border-color:#FF3D8B;-webkit-transform:translateY(-2px);transform:translateY(-2px)}
.overdue{border-color:#E8251F !important}

/* Buttons */
.btn-y{background:#FFE600;color:#0D1117;border:none;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;gap:6px;font-family:'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.05em;-webkit-transition:all .15s;transition:all .15s}
.btn-y:hover{background:#FFD000}
.btn-y:disabled{opacity:.4;cursor:not-allowed}
.btn-g{background:transparent;border:1px solid #2EA55A;color:#2EA55A;padding:9px 16px;font-size:13px;cursor:pointer;font-family:'Space Grotesk',sans-serif;text-transform:uppercase;-webkit-transition:all .15s;transition:all .15s}
.btn-g:hover{border-color:#FFE600;color:#FFE600}
.btn-r{background:transparent;color:#E8251F;border:1px solid #E8251F;padding:9px 16px;font-size:13px;cursor:pointer;font-family:'Space Grotesk',sans-serif;text-transform:uppercase}
.btn-r:hover{background:rgba(232,37,31,.1)}

/* Inputs */
input,textarea{font-family:'Space Grotesk',sans-serif;border:1px solid #2EA55A;padding:11px 14px;font-size:14px;color:#F0EDE8;background:#0D1117;outline:none;-webkit-transition:border .15s;transition:border .15s;width:100%;max-width:100%;display:block;-webkit-box-sizing:border-box;box-sizing:border-box}
input:focus,textarea:focus{border-color:#FFE600}
input::-webkit-input-placeholder{color:#4A5568;opacity:1}
input::-moz-placeholder{color:#4A5568;opacity:1}
input:-ms-input-placeholder{color:#4A5568}
input::placeholder{color:#4A5568;opacity:1}
textarea::-webkit-input-placeholder{color:#4A5568;opacity:1}
textarea::-moz-placeholder{color:#4A5568;opacity:1}
textarea:-ms-input-placeholder{color:#4A5568}
textarea::placeholder{color:#4A5568;opacity:1}
select{font-family:'Space Mono',monospace;border:1px solid #1B6E3C;padding:9px 30px 9px 12px;font-size:11px;font-weight:700;color:#2EA55A;background:#161B22;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;text-transform:uppercase;letter-spacing:.05em;-webkit-transition:border .15s;transition:border .15s;-webkit-box-sizing:border-box;box-sizing:border-box;max-width:100%}
select:focus{border-color:#FFE600;color:#FFE600}
select option{background:#161B22;color:#F0EDE8}
.sel-wrap{position:relative;display:inline-block}
label{font-size:10px;font-weight:700;color:#2EA55A;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:6px;font-family:'Space Mono',monospace}

/* Badges */
.badge{padding:3px 8px;font-size:10px;font-weight:700;font-family:'Space Mono',monospace;letter-spacing:.05em;display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;gap:4px;text-transform:uppercase}
.cdot{display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:#FF3D8B;color:#0D1117;font-size:9px;font-weight:700;font-family:'Space Mono',monospace;min-width:16px;height:16px;padding:0 3px;-webkit-animation:pdot 2s ease infinite;animation:pdot 2s ease infinite}

/* Modal */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(13,17,23,.85);z-index:50;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:20px}
.modal{background:#161B22;border:2px solid #1B6E3C;width:100%;max-width:560px;max-height:80vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-box-sizing:border-box;box-sizing:border-box;margin:auto}
.modal-body{-webkit-flex:1;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 20px 20px}

.modal-head{background:#1B6E3C;padding:10px 20px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center}
.modal-tabs{display:-webkit-flex;display:flex;border-bottom:1px solid #1B6E3C}
.modal-tab{-webkit-flex:1;flex:1;padding:10px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:transparent;color:#2EA55A;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.08em;font-family:'Space Mono',monospace;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;gap:6px;-webkit-transition:all .15s;transition:all .15s}
.modal-tab.active{background:rgba(255,230,0,.08);color:#FFE600;border-bottom-color:#FFE600}
.modal-body{padding:22px 26px 26px}
.modal-footer{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid #1B6E3C}

/* Progress */
.prog-track{height:6px;background:#1B2030;overflow:hidden}
.prog-fill{height:100%;-webkit-transition:width .5s ease;transition:width .5s ease}

/* Ticker */
.ticker-wrap{overflow:hidden;border-top:2px solid #1B6E3C;border-bottom:2px solid #1B6E3C;padding:7px 0;background:#0D1117;width:100%}
.ticker-inner{display:-webkit-flex;display:flex;white-space:nowrap;-webkit-animation:marquee 18s linear infinite;animation:marquee 18s linear infinite}
.ticker-item{font-family:'Space Mono',monospace;font-size:10px;color:#2EA55A;text-transform:uppercase;letter-spacing:.08em;padding:0 32px;-webkit-flex-shrink:0;flex-shrink:0}

/* Login */
.login-wrap{min-height:100vh;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:20px 16px;position:relative;overflow:hidden;-webkit-overflow-scrolling:touch}
.login-box{width:100%;max-width:400px;position:relative;z-index:1}
.login-card{border:1px solid #1B6E3C;padding:24px;background:rgba(22,27,34,.9)}
.login-wrap::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(27,110,60,.05) 60px,rgba(27,110,60,.05) 61px),repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(27,110,60,.05) 60px,rgba(27,110,60,.05) 61px)}
.login-box{width:100%;max-width:400px;position:relative;z-index:1}
.login-card{border:1px solid #1B6E3C;padding:28px;background:rgba(22,27,34,.9)}

/* Comments */
.cbox{background:#0D1117;border:1px solid #2EA55A;border-left:3px solid #FFE600;padding:14px 16px;margin-bottom:4px}

/* Stat */
.stat-grid{display:-webkit-flex;display:flex;gap:2px;margin-bottom:20px}
.stat-block{-webkit-flex:1;flex:1;background:#161B22;border:1px solid #1B6E3C;padding:18px;position:relative;overflow:hidden}
.stat-block::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sg::after{background:#2EA55A}.sy::after{background:#FFE600}.sp::after{background:#FF3D8B}.sr::after{background:#E8251F}

/* Avatar */
.av-wrap{position:relative;-webkit-flex-shrink:0;flex-shrink:0}

.av-over{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;opacity:0;-webkit-transition:opacity .15s;transition:opacity .15s;font-size:8px;color:#FFE600;font-family:'Space Mono',monospace;text-align:center;line-height:1.4}
.av-wrap:hover .av-over{opacity:1}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#FFE600;color:#0D1117;padding:11px 18px;font-size:12px;font-weight:700;z-index:200;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.05em;-webkit-animation:fadeUp .3s ease;animation:fadeUp .3s ease}

/* Docs */
.doc-card{background:#161B22;border:1px solid #1B6E3C;padding:16px;-webkit-transition:all .15s;transition:all .15s;cursor:pointer}
.doc-card:hover{border-color:#FF3D8B;-webkit-transform:translateY(-1px);transform:translateY(-1px)}
.doc-grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:2px}
.doc-grid .doc-card{width:calc(33.333% - 2px);min-width:220px;-webkit-flex:1;flex:1}
.upload-zone{border:2px dashed #1B6E3C;padding:16px 12px;text-align:center;cursor:pointer;-webkit-transition:border-color .15s;transition:border-color .15s;background:rgba(27,110,60,.04)}
.upload-zone:hover{border-color:#FFE600}
.upload-zone.drag-over{border-color:#FF3D8B;background:rgba(255,61,139,.05)}
.prog-bar{height:4px;background:#1B2030;margin-top:8px;overflow:hidden}
.prog-bar-fill{height:100%;background:#FFE600;-webkit-transition:width .2s;transition:width .2s}
@media(max-width:768px){
  .doc-grid .doc-card{width:100%}
}

/* ── Mobile layout ── */
@media(max-width:768px){
  .sidebar{display:none !important}
  .mobile-bar{display:-webkit-flex !important;display:flex !important}
  .app-wrap{-webkit-flex-direction:column;flex-direction:column}
  .page{padding:14px 12px}
  .stat-grid{-webkit-flex-wrap:wrap;flex-wrap:wrap}
  .stat-block{min-width:calc(50% - 1px);padding:12px}
  .two-col{-webkit-flex-direction:column;flex-direction:column;gap:10px}
  .board{-webkit-flex-direction:column;flex-direction:column;gap:8px;overflow-x:hidden}
  .board-col{min-width:unset;width:100%}
  .team-grid{-webkit-flex-direction:column;flex-direction:column}
  .team-card{width:100%}
  .filter-row{gap:6px}
  .overlay{padding:0;-webkit-align-items:flex-end;align-items:flex-end;background:rgba(0,0,0,.6)}
  .overlay{padding:20px 16px !important;-webkit-align-items:center !important;align-items:center !important;background:rgba(0,0,0,.75) !important}
  .modal{width:calc(100% - 32px) !important;max-width:calc(100% - 32px) !important;max-height:80vh;border:2px solid #1B6E3C !important;border-top:3px solid #FF3D8B !important;border-radius:4px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal-head{padding:10px 14px}
  .modal-body{padding:12px 14px 16px}
  .modal-footer{padding-top:10px;margin-top:10px}
  .modal-footer{display:-webkit-flex;display:flex;gap:8px}
  .modal-footer .btn-y,.modal-footer .btn-g,.modal-footer .btn-r{-webkit-flex:1;flex:1;padding:10px 8px;font-size:12px;justify-content:center;text-align:center}
  .modal input,.modal textarea{font-size:13px !important;padding:9px 11px !important}
  .modal select{font-size:11px !important;padding:9px 24px 9px 10px !important}
  .modal label{font-size:9px !important;margin-bottom:4px !important}
  .modal h1,.modal-head span{font-size:10px !important}
  .modal [style*="gridTemplateColumns"]{grid-template-columns:1fr 1fr !important}
  .cbox{padding:10px 12px}
  .ticker-item{padding:0 16px;font-size:9px}
  /* Docs search full width on mobile */
  .docs-search{width:100% !important;flex:1 1 100% !important}
  /* Upload modal — stack fields, scrollable overlay */
  .upload-modal-grid{grid-template-columns:1fr !important}
  .docs-overlay{-webkit-align-items:flex-start !important;align-items:flex-start !important;overflow-y:auto !important;-webkit-overflow-scrolling:touch;padding:55px 0 0 0 !important}
  .docs-overlay .modal{max-height:none !important;height:auto !important;overflow-y:visible !important;margin:0 !important;border-radius:0 !important;width:100% !important}
  /* Recent activity cards on mobile — expand on tap */
  .recent-card{cursor:pointer;-webkit-transition:background .15s;transition:background .15s}
  .recent-card-title{white-space:normal !important;overflow:visible !important;text-overflow:unset !important}
  .recent-card-desc{display:none}
  .recent-card.expanded .recent-card-desc{display:block !important}
  .recent-card.expanded{background:rgba(27,110,60,.1) !important}
  .expand-hint{display:inline-block;font-size:10px;color:#2EA55A;font-family:Space Mono,monospace;margin-left:6px}
}
@media(min-width:769px){
  .mobile-bar{display:none !important}
  .recent-card-desc{display:none !important}
  .recent-card{cursor:default}
  .sched-btn-short{display:none !important}
}
@media(max-width:768px){
  .sched-btn-full{display:none !important}
}

/* Two-col grid */
.two-col{display:-webkit-flex;display:flex;gap:14px;margin-bottom:14px}
.two-col > *{-webkit-flex:1;flex:1;min-width:0}

.board{display:-webkit-flex;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.board-col{-webkit-flex:1;flex:1;min-width:220px;background:rgba(27,110,60,.04);border:1px solid #1B6E3C;padding:12px}
@media(max-width:768px){
  .board{-webkit-flex-direction:column;flex-direction:column;overflow-x:hidden}
  .board-col{width:100%;-webkit-flex:none;flex:none;min-width:unset}
}
.team-grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:2px}
.team-card{width:calc(50% - 1px);background:#161B22;border:1px solid #1B6E3C;padding:16px}
.filter-row{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;-webkit-align-items:center;align-items:center;margin-bottom:20px}

.ro-field{padding:11px 14px;border:1px solid #1B6E3C;color:#F0EDE8;background:#0D1117;font-size:14px;min-height:42px}
.sign-out{background:transparent;border:1px solid #1B6E3C;cursor:pointer;color:#2EA55A;font-size:9px;padding:4px 7px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.sign-out:hover{border-color:#E8251F;color:#E8251F}

/* Burger menu */
.burger-btn{background:none;border:none;cursor:pointer;padding:6px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:5px;-webkit-justify-content:center;justify-content:center}
.burger-line{width:22px;height:2px;background:#2EA55A;display:block;-webkit-transition:all .2s;transition:all .2s}
.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:90;display:none}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:260px;background:#0D1117;border-left:2px solid #1B6E3C;z-index:100;-webkit-transform:translateX(100%);transform:translateX(100%);-webkit-transition:-webkit-transform .25s ease;transition:transform .25s ease;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:0;overflow-y:auto}
.drawer.open{-webkit-transform:translateX(0);transform:translateX(0)}

/* ── Mobile base (phones up to 768px) ───────────────────────── */
@media(max-width:768px){
  .app-wrap{-webkit-flex-direction:column;flex-direction:column}
  .main-col{min-height:0}

  /* Sidebar becomes a top nav bar */
  .sidebar{
    width:100%;min-width:unset;min-height:auto;
    -webkit-flex-direction:row;flex-direction:row;
    -webkit-align-items:center;align-items:center;
    padding:10px 14px;border-right:none;
    border-bottom:2px solid #1B6E3C;
    position:sticky;top:0;z-index:40;background:#0D1117;
  }
  .sidebar-logo{padding:0;border:none;-webkit-flex:1;flex:1}
  .sidebar-logo img{width:32px;height:32px}
  .sidebar-logo-text{display:none}
  .sidebar-nav{
    padding:0;display:-webkit-flex;display:flex;
    -webkit-flex-direction:row;flex-direction:row;
    gap:2px;-webkit-flex:0 0 auto;flex:0 0 auto
  }
  .sidebar-user{
    border-top:none;padding:0;margin-left:8px;
    -webkit-flex:0 0 auto;flex:0 0 auto
  }
  .nav-btn{
    padding:7px 10px;border-left:none;
    border-bottom:3px solid transparent;margin-bottom:0;
    -webkit-flex-direction:column;flex-direction:column;gap:2px;
    font-size:9px;min-width:52px;-webkit-justify-content:center;justify-content:center;
    -webkit-align-items:center;align-items:center;text-align:center
  }
  .nav-btn.active{background:rgba(255,230,0,.08);border-left:none;border-bottom:3px solid #FFE600}
  .nav-btn-icon{font-size:16px}
  .nav-btn-badge{position:absolute;top:4px;right:4px}

  /* Page padding */
  .page{padding:16px 14px}

  /* Stats — 2x2 grid */
  .stat-grid{-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:2px}
  .stat-block{min-width:calc(50% - 1px);padding:14px}
  .stat-block .stat-num{font-size:28px}

  /* Two col → single col */
  .two-col{-webkit-flex-direction:column;flex-direction:column;gap:10px}

  /* Board → single col with horizontal scroll tabs */
  .board{-webkit-flex-direction:column;flex-direction:column;gap:10px}
  .board-col{min-width:unset}

  /* Team cards — full width */
  .team-grid{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
  .team-card{width:100%}

  /* Filters — wrap tightly */
  .filter-row{gap:6px}
  .filter-row input{width:100%;-webkit-flex:1 1 100%;flex:1 1 100%}
  .filter-row .sel-wrap select{font-size:10px;padding:7px 24px 7px 8px}

  /* Modal — full screen on mobile */
  .overlay{padding:0;-webkit-align-items:flex-end;align-items:flex-end}
  .modal{width:100%;max-width:100%;max-height:80vh;border-top:3px solid #FF3D8B;}
  .modal-body{padding:14px 14px 20px}
  .modal-footer{padding-top:12px;margin-top:14px}

  /* Task cards */
  .task-card{padding:12px}

  /* Sign out button — hide text on very small screens */
  .sign-out{font-size:8px;padding:3px 6px}

  /* Ticker */
  .ticker-item{padding:0 20px;font-size:9px}

  /* Hide teambase subtitle in sidebar on mobile */
  .sidebar-sub{display:none}
}

/* ── Small phones (under 380px) ─────────────────────────────── */
@media(max-width:380px){
  .nav-btn{padding:6px 7px;min-width:44px;font-size:8px}
  .page{padding:12px 10px}
  .stat-block{padding:10px 12px}
  .modal-body{padding:12px 12px 16px}
}

/* ── Tablet portrait (769–1024px) ───────────────────────────── */
@media(min-width:769px) and (max-width:1024px){
  .sidebar{width:180px;min-width:180px}
  .page{padding:20px 18px}
  .stat-block{padding:14px}
  .board{gap:6px}
  .board-col{padding:10px}
  .two-col{gap:10px}
  .filter-row{gap:6px}
}
</style>

// ── Utils ─────────────────────────────────────────────────────────────────────
function uid(){return 't'+Date.now()+Math.random().toString(36).substr(2,4)}
function cuid(){return 'c'+Date.now()+Math.random().toString(36).substr(2,4)}
function gmem(id){for(var i=0;i<MEMBERS.length;i++){if(MEMBERS[i].id===id)return MEMBERS[i];}return null;}
function isOD(dl){return dl&&new Date(dl)<new Date(new Date().toDateString())}
function isWk(dl){if(!dl)return false;var d=new Date(dl),n=new Date(),e=new Date();e.setDate(n.getDate()+7);return d>=n&&d<=e;}
function fmtD(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function relT(ts){if(!ts)return '';var m=Math.floor((Date.now()-ts)/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';var hh=Math.floor(m/60);if(hh<24)return hh+'h ago';return Math.floor(hh/24)+'d ago';}
function lsGet(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function canEdit(user,task){
  if(!task||!task.id)return true;
  // Admins can edit everything
  for(var i=0;i<ADMINS.length;i++){if(ADMINS[i]===(user||'').toLowerCase())return true;}
  // Unassigned tasks can be edited by anyone
  if(!task.assignedTo)return true;
  var m=null;for(var j=0;j<MEMBERS.length;j++){if(MEMBERS[j].name.toLowerCase()===(user||'').toLowerCase()){m=MEMBERS[j];break;}}
  if(!m)return false;
  // Assignee can edit their own task
  if(task.assignedTo===m.id)return true;
  // Creator can edit tasks they created
  if(task.createdBy&&task.createdBy===m.name)return true;
  return false;
}
function getTZInfo(tz){
  if(!tz)return null;
  try{
    var now=new Date();
    var time=now.toLocaleTimeString('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:true});
    var city=tz.split('/').pop().replace(/_/g,' ');
    var local=new Date(now.toLocaleString('en-US',{timeZone:tz}));
    var utc=new Date(now.toLocaleString('en-US',{timeZone:'UTC'}));
    var off=Math.round((local-utc)/60000);
    var sign=off>=0?'+':'-';
    var a=Math.abs(off);
    var offset='GMT'+sign+Math.floor(a/60)+(a%60?':'+String(a%60).padStart(2,'0'):'');
    var h=parseInt(now.toLocaleString('en-US',{timeZone:tz,hour:'numeric',hour12:false}))||0;
    var emoji=h>=20||h<6?'🌙':h<9?'🌅':h>=17?'🌆':'☀️';
    return {time:time,city:city,offset:offset,emoji:emoji};
  }catch(e){return null;}
}

function wkRange(offset){
  var now=new Date(),day=now.getDay(),diff=now.getDate()-day+(day===0?-6:1);
  var mon=new Date(now);mon.setDate(diff+offset*7);mon.setHours(0,0,0,0);
  var sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  return[mon,sun];
}

// ── Firebase ──────────────────────────────────────────────────────────────────
function gDB(){return window.__DB;}
function gFS(){return window.__FS;}
function fbAdd(task){
  var fs=gFS(),rest={};
  for(var k in task){if(k!=='id')rest[k]=task[k];}
  rest.createdAt=fs.serverTimestamp();
  return fs.addDoc(fs.collection(gDB(),'tasks'),rest);
}
function fbUpd(task){
  var fs=gFS(),rest={};
  for(var k in task){if(k!=='id')rest[k]=task[k];}
  return fs.updateDoc(fs.doc(gDB(),'tasks',task.id),rest);
}
function fbDel(id){return gFS().deleteDoc(gFS().doc(gDB(),'tasks',id));}
function fbSub(cb){
  var fs=gFS();
  var q=fs.query(fs.collection(gDB(),'tasks'),fs.orderBy('createdAt','desc'));
  return fs.onSnapshot(q,function(snap){
    var out=[];
    snap.docs.forEach(function(d){
      var data=d.data();
      var ts=data.createdAt;
      var obj={id:d.id};
      for(var k in data)obj[k]=data[k];
      obj.createdAt=(ts&&typeof ts.toMillis==='function')?ts.toMillis():Date.now();
      out.push(obj);
    });
    cb(out);
  });
}
function resizeImg(dataUrl,max,cb){
  var img=new Image();
  img.onload=function(){
    var r=Math.min(max/img.width,max/img.height,1);
    var w=Math.round(img.width*r),hh=Math.round(img.height*r);
    var c=document.createElement('canvas');c.width=w;c.height=hh;
    c.getContext('2d').drawImage(img,0,0,w,hh);
    cb(c.toDataURL('image/jpeg',.8));
  };
  img.src=dataUrl;
}
function fbSavePic(mid,dataUrl){
  resizeImg(dataUrl,180,function(resized){
    var fs=gFS();
    fs.setDoc(fs.doc(gDB(),'profiles',String(mid)),{pic:resized,updatedAt:Date.now()});
  });
}
function fbSubPics(cb){
  var fs=gFS();
  return fs.onSnapshot(fs.collection(gDB(),'profiles'),function(snap){
    var pics={};
    snap.docs.forEach(function(d){pics[String(d.id)]=d.data().pic;});
    cb(pics);
  });
}

  var q=fs.query(fs.collection(gDB(),'docs'),fs.orderBy('createdAt','desc'));
  return fs.onSnapshot(q,function(snap){
    var out=[];
    snap.docs.forEach(function(d){
      var data=d.data();
      var ts=data.createdAt;
      var obj={id:d.id};
      for(var k in data)obj[k]=data[k];
      obj.createdAt=(ts&&typeof ts.toMillis==='function')?ts.toMillis():Date.now();
      out.push(obj);
    });
    cb(out);
  });
}
function uploadFile(file, onProgress, onDone, onError){
  var CLOUD='dlctazmoi';
  var PRESET='jc_teambase';
  // Pick resource type based on file type
  var type=file.type||'';
  var resourceType='raw';
  if(type.indexOf('image')>-1) resourceType='image';
  else if(type.indexOf('video')>-1) resourceType='video';
  var url='https://api.cloudinary.com/v1_1/'+CLOUD+'/'+resourceType+'/upload';
  var fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',PRESET);
  fd.append('resource_type',resourceType);
  var xhr=new XMLHttpRequest();
  xhr.open('POST',url,true);
  xhr.upload.onprogress=function(e){
    if(e.lengthComputable&&onProgress) onProgress(Math.round(e.loaded/e.total*100));
  };
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        var res=JSON.parse(xhr.responseText);
        if(onDone) onDone(res.secure_url, res.public_id);
      }catch(e){
        if(onError) onError(new Error('Parse error'));
      }
    } else {
      console.error('Cloudinary error:', xhr.status, xhr.responseText);
      if(onError) onError(new Error('Upload failed ('+xhr.status+'): '+xhr.responseText));
    }
  };
  xhr.onerror=function(){if(onError) onError(new Error('Network error - check connection'));};
  xhr.send(fd);
}

// ── Docs Page ─────────────────────────────────────────────────────────────────
function Docs(p){
  var docs=p.docs||[], user=p.user||'';
  var isAdmin=ADMINS.indexOf(user.toLowerCase())>-1;
  var s1=useState('All'),tf=s1[0],setTf=s1[1];
  var sq=useState(''),q=sq[0],setQ=sq[1];
  var s2=useState(false),showForm=s2[0],setShowForm=s2[1];
  var s3=useState({title:'',desc:'',team:'Both',url:'',file:null}),form=s3[0],setForm=s3[1];
  var s4=useState(0),progress=s4[0],setProgress=s4[1];
  var s5=useState(false),uploading=s5[0],setUploading=s5[1];
  var s6=useState('file'),inputType=s6[0],setInputType=s6[1];
  var s7=useState(null),preview=s7[0],setPreview=s7[1];
  var fileRef=useRef(null);

  function setF(k,v){setForm(function(f){var n={};for(var kk in f)n[kk]=f[kk];n[k]=v;return n;});}

  function getFileIcon(name){
    if(!name) return '📄';
    var ext=(name.split('.').pop()||'').toLowerCase();
    if(['pdf'].indexOf(ext)>-1) return '📕';
    if(['doc','docx'].indexOf(ext)>-1) return '📘';
    if(['xls','xlsx'].indexOf(ext)>-1) return '📗';
    if(['png','jpg','jpeg','gif','webp'].indexOf(ext)>-1) return '🖼';
    if(['mp4','mov','avi'].indexOf(ext)>-1) return '🎬';
    return '📄';
  }

  function handleFileChange(e){
    var f=e.target.files[0];
    if(!f) return;
    setF('file',f);
    setF('title',f.name.replace(/\.[^.]+$/,''));
    if(f.type.indexOf('image')>-1){
      var reader=new FileReader();
      reader.onload=function(ev){setPreview(ev.target.result);};
      reader.readAsDataURL(f);
    } else {
      setPreview(null);
    }
  }

  function submit(){
    if(!form.title.trim()){alert('Please add a title.');return;}
    if(inputType==='url'&&!form.url.trim()){alert('Please enter a URL.');return;}
    if(inputType==='file'&&!form.file){alert('Please select a file.');return;}
    setUploading(true);
    var fs=gFS();
    if(inputType==='url'){
      var docData={title:form.title,desc:form.desc,team:form.team,url:form.url,fileUrl:'',fileName:'',fileType:'url',uploadedBy:user,createdAt:fs.serverTimestamp()};
      fbAddDoc(docData,function(){
        setShowForm(false);setForm({title:'',desc:'',team:'Both',url:'',file:null});setPreview(null);setUploading(false);
      });
    } else {
      uploadFile(form.file,
        function(pct){setProgress(pct);},
        function(url,path){
          var docData={title:form.title,desc:form.desc,team:form.team,url:url,fileName:form.file.name,fileType:form.file.type,filePath:path,uploadedBy:user,createdAt:fs.serverTimestamp()};
          fbAddDoc(docData,function(){
            setShowForm(false);setForm({title:'',desc:'',team:'Both',url:'',file:null});setProgress(0);setPreview(null);setUploading(false);
          });

// ── Schedule Page ──────────────────────────────────────────────────────────────
function Schedule(p){
  var user=p.user||'';
  var isAdmin=ADMINS.indexOf(user.toLowerCase())>-1;
  var sTZ=useState([]),tzList=sTZ[0],setTZList=sTZ[1];
  var sNew=useState(''),newTZ=sNew[0],setNewTZ=sNew[1];
  var sTick=useState(0),tick=sTick[1];

  useEffect(function(){
    var unsub=fbSubTZList(function(list){
      if(list&&Array.isArray(list))setTZList(list);
    });
    return unsub;
  },[]);

  useEffect(function(){
    var iv=setInterval(function(){tick(function(n){return n+1;});},30000);
    return function(){clearInterval(iv);};
  },[]);

  function save(list){
    setTZList(list);
    fbSaveTZList(list);
  }

  // ── When2Meet state ────────────────────────────────────────────────────────
  var deviceTZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
  var sHover=useState(null),hoverSlot=sHover[0],setHoverSlot=sHover[1];
  var sMyTZ=useState('device'),myTZ=sMyTZ[0],setMyTZ=sMyTZ[1];
  var sWinStart=useState(8),winStart=sWinStart[0],setWinStart=sWinStart[1];
  var sWinEnd=useState(22),winEnd=sWinEnd[0],setWinEnd=sWinEnd[1];
  var schedule=p.schedule||{};
  var avail=schedule.availability||{};
  var scheduleDates=schedule.dates||[];
  var sDateIn=useState(''),dateInput=sDateIn[0],setDateInput=sDateIn[1];
  var sDRS=useState(''),dateRangeStart=sDRS[0],setDateRangeStart=sDRS[1];
  var sDRE=useState(''),dateRangeEnd=sDRE[0],setDateRangeEnd=sDRE[1];

  function getActiveTZ(){return myTZ==='device'?deviceTZ:myTZ;}

  // Get the UTC offset in hours for a timezone
  function getTZOffset(tz){
    try{
      var now=new Date();
      var local=new Date(now.toLocaleString('en-US',{timeZone:tz}));
      var utcDate=new Date(now.toLocaleString('en-US',{timeZone:'UTC'}));
      return Math.round((local-utcDate)/3600000);
    }catch(ex){return 0;}
  }

  // Store as "tz_hour" key so different timezones map correctly
  function slotKey(date,hour,tz){
    var offset=getTZOffset(tz);
    var utcH=((hour-offset)%24+24)%24;
    return date+'__'+utcH;
  }

  function isMine(date,hour){
    var tz=getActiveTZ();
    var key=slotKey(date,hour,tz);
    return !!(avail[user]&&avail[user][key]);
  }

  function toggleSlot(date,hour){
    var tz=getActiveTZ();
    var key=slotKey(date,hour,tz);
    var mine=Object.assign({},avail[user]||{});
    if(mine[key]){delete mine[key];}else{mine[key]=true;}
    var newAvail=Object.assign({},avail);
    newAvail[user]=mine;
    p.onSave({availability:newAvail,dates:scheduleDates});
  }

  function getCount(date,hour){
    var tz=getActiveTZ();
    var key=slotKey(date,hour,tz);
    var n=0;
    Object.keys(avail).forEach(function(name){if(avail[name]&&avail[name][key])n++;});
    return n;
  }

  function getWho(date,hour){
    var tz=getActiveTZ();
    var key=slotKey(date,hour,tz);
    var free=[],busy=[];
    MEMBERS.forEach(function(m){
      if(scheduleDates.length===0)return;
      if(avail[m.name]&&avail[m.name][key])free.push(m);
      else busy.push(m);
    });
    return{free:free,busy:busy};
  }

  function addDate(){
    if(!dateInput)return;
    if(scheduleDates.indexOf(dateInput)>-1){alert('Date already added');return;}
    var nd=[].concat(scheduleDates,[dateInput]).sort();
    p.onSave({availability:avail,dates:nd});
    setDateInput('');
  }

  function addDateRange(){
    if(!dateRangeStart||!dateRangeEnd)return;
    var start=new Date(dateRangeStart+'T00:00:00');
    var end=new Date(dateRangeEnd+'T00:00:00');
    if(start>end){alert('Start date must be before end date');return;}
    var nd=[].concat(scheduleDates);
    var cur=new Date(start);
    while(cur<=end){
      var iso=cur.toISOString().slice(0,10);
      if(nd.indexOf(iso)<0)nd.push(iso);
      cur.setDate(cur.getDate()+1);
    }
    nd.sort();
    p.onSave({availability:avail,dates:nd});
    setDateRangeStart('');
    setDateRangeEnd('');
  }

  function clearAllDates(){
    if(!window.confirm('Clear all dates and availability?'))return;
    p.onSave({availability:{},dates:[]});
  }

  function getBestSlot(){
    var best=null,bestCount=0;
    scheduleDates.forEach(function(d){
      meetHours.forEach(function(hr){
        var tz=getActiveTZ();
        var key=slotKey(d,hr,tz);
        var n=0;
        Object.keys(avail).forEach(function(name){if(avail[name]&&avail[name][key])n++;});
        if(n>bestCount){bestCount=n;best={date:d,hour:hr,count:n};}
      });
    });
    return best;
  }

  function getBestSlots(){
    var bestCount=0,slots=[];
    scheduleDates.forEach(function(d){
      meetHours.forEach(function(hr){
        var tz=getActiveTZ();
        var key=slotKey(d,hr,tz);
        var n=0;
        Object.keys(avail).forEach(function(name){if(avail[name]&&avail[name][key])n++;});
        if(n>0){
          if(n>bestCount){bestCount=n;slots=[{date:d,hour:hr,count:n}];}
          else if(n===bestCount){slots.push({date:d,hour:hr,count:n});}
        }
      });
    });
    return slots;
  }

  function doSchedule(slot){
    var tz=getActiveTZ();
    var offset=getTZOffset(tz);
    var utcHour=((slot.hour-offset)%24+24)%24;
    var yr=slot.date.split('-')[0];
    var mo=slot.date.split('-')[1];
    var dy=slot.date.split('-')[2];
    var dt=new Date(Date.UTC(parseInt(yr),parseInt(mo)-1,parseInt(dy),utcHour,0,0));
    fbSaveMeeting({
      title:'Team Meeting',
      link:(p.meeting&&p.meeting.link)||'',
      utcTime:dt.toISOString(),
      updatedAt:Date.now()
    });
  }

  var sBestSlots=useState([]),bestSlotOptions=sBestSlots[0],setBestSlotOptions=sBestSlots[1];

  function scheduleBestSlot(){
    var slots=getBestSlots();
    if(!slots.length){alert('No availability data yet');return;}
    if(slots.length===1){
      if(window.confirm('Schedule meeting on '+fmtDate(slots[0].date)+' at '+fmtH(slots[0].hour)+' ('+slots[0].count+' people free)?')){
        doSchedule(slots[0]);
        alert('Meeting scheduled!');
      }
    } else {
      setBestSlotOptions(slots);
    }
  }

  function removeDate(d){
    var nd=scheduleDates.filter(function(x){return x!==d;});
    var na={};
    Object.keys(avail).forEach(function(name){
      var slots={};
      Object.keys(avail[name]||{}).forEach(function(k){if(k.indexOf(d+'__')!==0)slots[k]=true;});
      na[name]=slots;
    });
    p.onSave({availability:na,dates:nd});
  }

  function clearMine(){
    var na=Object.assign({},avail);
    na[user]={};
    p.onSave({availability:na,dates:scheduleDates});
  }

  function fmtDate(d){
    var dt=new Date(d+'T00:00:00');
    return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  }

  function slotBg(count){
    if(count===0)return 'transparent';
    var pct=count/MEMBERS.length;
    if(pct>=0.8)return 'rgba(46,165,90,.8)';
    if(pct>=0.5)return 'rgba(46,165,90,.5)';
    if(pct>=0.25)return 'rgba(46,165,90,.3)';
    return 'rgba(46,165,90,.15)';
  }

  var TZ_OPTIONS=[
    ['device','Current Device Time ('+deviceTZ.split('/').pop().replace(/_/g,' ')+')',],
    ['UTC','UTC — Universal Time'],
    ['Africa/Cairo','Cairo (GMT+2)'],['Africa/Nairobi','Nairobi (GMT+3)'],
    ['America/New_York','New York (GMT-5)'],['America/Chicago','Chicago (GMT-6)'],
    ['America/Los_Angeles','Los Angeles (GMT-8)'],['America/Sao_Paulo','São Paulo (GMT-3)'],
    ['Asia/Dubai','Dubai (GMT+4)'],['Asia/Kolkata','Mumbai / Delhi (GMT+5:30)'],
    ['Asia/Bangkok','Bangkok (GMT+7)'],['Asia/Ho_Chi_Minh','Vietnam (GMT+7)'],
    ['Asia/Singapore','Singapore (GMT+8)'],['Asia/Hong_Kong','Hong Kong (GMT+8)'],
    ['Asia/Shanghai','Shanghai (GMT+8)'],['Asia/Tokyo','Tokyo (GMT+9)'],
    ['Asia/Seoul','Seoul (GMT+9)'],['Asia/Manila','Manila (GMT+8)'],
    ['Asia/Kuala_Lumpur','Kuala Lumpur (GMT+8)'],['Asia/Jakarta','Jakarta (GMT+7)'],
    ['Australia/Sydney','Sydney (GMT+11)'],
    ['Europe/London','London (GMT+0)'],['Europe/Paris','Paris (GMT+1)'],
    ['Europe/Berlin','Berlin (GMT+1)'],['Europe/Moscow','Moscow (GMT+3)'],
    ['Europe/Istanbul','Istanbul (GMT+3)'],
    ['Pacific/Auckland','Auckland (GMT+13)'],['Pacific/Honolulu','Honolulu (GMT-10)'],
  ];

  var meetHours=[];for(var wh=winStart;wh<=winEnd;wh++)meetHours.push(wh);
  var fmtH=function(h){return h===0?'12 AM':h<12?h+' AM':h===12?'12 PM':(h-12)+' PM';};
  var allHours=[];for(var ah=0;ah<24;ah++)allHours.push(ah);

  function addTZ(){
    var v=newTZ.trim();
    if(!v)return;
    try{new Date().toLocaleString('en-US',{timeZone:v});}
    catch(e){alert('Invalid timezone. Use format like: America/New_York, Asia/Singapore, Europe/London');return;}
    if(tzList.indexOf(v)>-1){alert('Already added');return;}
    save(tzList.concat([v]));
    setNewTZ('');
  }

  function getTime(tz,hour){
    try{
      var now=new Date();
      var userTZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
      var midnight=new Date(now.toLocaleDateString('en-US',{timeZone:userTZ}));
      var t=new Date(midnight.getTime()+hour*3600000);

// ── Meeting Block ─────────────────────────────────────────────────────────────
function MeetingBlock(p){
  var meeting=p.meeting, user=p.user||'', onSave=p.onSaveMeeting;
  var isAdmin=ADMINS.indexOf(user.toLowerCase())>-1;
  var m=null;for(var i=0;i<MEMBERS.length;i++){if(MEMBERS[i].name.toLowerCase()===user.toLowerCase()){m=MEMBERS[i];break;}}
  var sEdit=useState(false),editing=sEdit[0],setEditing=sEdit[1];
  var sLink=useState(''),link=sLink[0],setLink=sLink[1];
  var sTime=useState(''),time=sTime[0],setTime=sTime[1];
  var sTitle=useState(''),title=sTitle[0],setTitle=sTitle[1];

  function getLocalTime(utcIso){
    if(!utcIso) return null;
    try{
      var d=new Date(utcIso);
      var tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
      var timeStr=d.toLocaleTimeString('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:true});
      var dateStr=d.toLocaleDateString('en-US',{timeZone:tz,weekday:'short',month:'short',day:'numeric'});
      var tzParts=tz.split('/');
      var city=tzParts[tzParts.length-1].replace(/_/g,' ');
      var local=new Date(d.toLocaleString('en-US',{timeZone:tz}));
      var utc=new Date(d.toLocaleString('en-US',{timeZone:'UTC'}));
      var off=Math.round((local-utc)/60000);
      var sign=off>=0?'+':'-';
      var a=Math.abs(off);
      var offset='GMT'+sign+Math.floor(a/60)+(a%60?':'+String(a%60).padStart(2,'0'):'');
      return{timeStr:timeStr,dateStr:dateStr,city:city,offset:offset};
    }catch(e){return null;}
  }

  function getCalUrl(){
    if(!meeting||!meeting.utcTime) return '#';
    var d=new Date(meeting.utcTime);
    var endD=new Date(d.getTime()+60*60*1000);
    function fmt(dt){
      return dt.getUTCFullYear()+
        String(dt.getUTCMonth()+1).padStart(2,'0')+
        String(dt.getUTCDate()).padStart(2,'0')+'T'+
        String(dt.getUTCHours()).padStart(2,'0')+
        String(dt.getUTCMinutes()).padStart(2,'0')+'00Z';
    }
    var title=encodeURIComponent(meeting.title||'Jelly Circle Team Meeting');
    var loc=encodeURIComponent(meeting.link||'');
    var details=encodeURIComponent('Join: '+(meeting.link||''));
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+title+'&dates='+fmt(d)+'/'+fmt(endD)+'&location='+loc+'&details='+details;
  }

  function save(){
    // Allow saving with empty values to effectively clear the meeting
    var data={title:title,link:link,utcTime:'',updatedAt:Date.now()};
    if(time.trim()){
      var d=new Date(time);
      if(isNaN(d.getTime())){alert('Invalid date/time');return;}
      data.utcTime=d.toISOString();
    }
    onSave(data)
      .then(function(){setEditing(false);})
      .catch(function(e){console.error(e);});
  }

  var localTime=meeting?getLocalTime(meeting.utcTime):null;

  var memberColor=m?m.color:'#2EA55A';
  return h('div',{style:{margin:'12px 12px 12px',border:'1px solid '+memberColor,background:memberColor+'12',padding:'12px',boxSizing:'border-box',width:'calc(100% - 24px)'}},
    !editing&&h('div',null,
      h('a',{
        href:meeting&&meeting.link?meeting.link:'#',
        target:'_blank',
        rel:'noopener noreferrer',
        style:{display:'flex',alignItems:'center',gap:8,background:memberColor,color:'#0D1117',padding:'8px 10px',textDecoration:'none',fontFamily:'Space Mono,monospace',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:8,justifyContent:'center',boxSizing:'border-box',width:'100%'}
      },
        h('span',{style:{fontSize:14}},'🎥'),
        'Join Meeting'
      ),
      meeting&&localTime&&h('div',{style:{marginBottom:8}},
        h('div',{style:{fontSize:12,fontWeight:600,color:'#F0EDE8',marginBottom:2}},meeting.title||'Team Meeting'),
        h('div',{className:'mono',style:{fontSize:10,color:'#FFE600'}},localTime.dateStr),
        h('div',{className:'mono',style:{fontSize:10,color:'#FFE600'}},localTime.timeStr+' ('+localTime.offset+')')
      ),
      !meeting&&h('div',{className:'mono',style:{fontSize:10,color:'#4A5568',marginBottom:8,textAlign:'center'}},'// No meeting set'),
      meeting&&h('div',{style:{display:'flex',flexDirection:'column',gap:4,marginBottom:isAdmin?6:0}},
        h('a',{
          href:getCalUrl(),
          target:'_blank',
          rel:'noopener noreferrer',
          style:{display:'flex',alignItems:'center',justifyContent:'center',gap:6,border:'1px solid '+memberColor,color:memberColor,padding:'6px',textDecoration:'none',fontFamily:'Space Mono,monospace',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em'}
        },'+ Add to Calendar'),
        meeting&&h('button',{
          onClick:function(){
            var lines=[];
            if(meeting.title)lines.push(meeting.title);
            if(meeting.utcTime){
              try{
                var tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
                var d=new Date(meeting.utcTime);
                var dateStr=d.toLocaleDateString('en-US',{timeZone:tz,weekday:'long',year:'numeric',month:'long',day:'numeric'});
                var timeStr=d.toLocaleTimeString('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:true});
                lines.push(dateStr+' at '+timeStr);
              }catch(ex){}
            }
            if(meeting.link)lines.push(meeting.link);
            var text=lines.join(String.fromCharCode(10));
            if(navigator.clipboard){navigator.clipboard.writeText(text);}
            else{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
            alert('Copied!');
          },
          style:{background:'transparent',border:'1px solid '+memberColor,color:memberColor,padding:'6px',fontFamily:'Space Mono,monospace',fontSize:10,fontWeight:700,cursor:'pointer',textTransform:'uppercase',width:'100%'}
        },'Copy Meeting Details')
      ),
      isAdmin&&h('button',{
        onClick:function(){setLink(meeting?meeting.link:'');setTime(meeting&&meeting.utcTime?new Date(meeting.utcTime).toISOString().slice(0,16):'');setTitle(meeting?meeting.title||'':'Team Meeting');setEditing(true);},
        style:{width:'100%',background:'transparent',border:'1px dashed '+memberColor,color:memberColor,padding:'6px 4px',fontFamily:'Space Mono,monospace',fontSize:9,cursor:'pointer',textTransform:'uppercase',letterSpacing:'.04em',boxSizing:'border-box',wordBreak:'break-word',whiteSpace:'normal'}
      },'Edit Meeting')
    ),
    editing&&h('div',null,
      h('div',{className:'mono',style:{fontSize:9,color:'#FFE600',marginBottom:10,letterSpacing:'.08em'}},'// SET MEETING'),
      h('div',{style:{marginBottom:8}},
        h('label',null,'Title (optional)'),
        h('input',{value:title,onChange:function(e){setTitle(e.target.value);},placeholder:'Team Meeting',
          style:{fontSize:11,padding:'5px 8px',width:'100%',boxSizing:'border-box',display:'block'}})
      ),
      h('div',{style:{marginBottom:8}},
        h('label',null,'Meet Link'),
        h('input',{value:link,onChange:function(e){setLink(e.target.value);},placeholder:'https://meet.google.com/...',
          style:{fontSize:11,padding:'5px 8px',width:'100%',boxSizing:'border-box',display:'block'}})
      ),
      h('div',{style:{marginBottom:10}},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}},
          h('label',{style:{margin:0}},'Date & Time'),
          time&&h('button',{onClick:function(){setTime('');},style:{background:'transparent',border:'none',color:'#E8251F',fontFamily:'Space Mono,monospace',fontSize:10,cursor:'pointer',padding:'0 2px',textTransform:'uppercase',letterSpacing:'.04em'}},
            '— Clear'
          )
        ),
        h('div',{style:{border:'1px solid #2EA55A',background:'#0D1117',width:'100%',boxSizing:'border-box'}},
          h('input',{type:'datetime-local',value:time,onChange:function(e){setTime(e.target.value);},
            style:{display:'block',width:'100%',border:'none',outline:'none',background:'transparent',color:'#F0EDE8',padding:'5px 8px',fontFamily:'Space Grotesk,sans-serif',fontSize:11,boxSizing:'border-box',colorScheme:'dark'}})
        )
      ),
      h('div',{style:{display:'flex',gap:6}},
        h('button',{onClick:save,style:{flex:1,background:'#FFE600',color:'#0D1117',border:'none',padding:'8px',fontFamily:'Space Mono,monospace',fontSize:10,fontWeight:700,cursor:'pointer',textTransform:'uppercase'}},'Save'),
        h('button',{onClick:function(){setEditing(false);},style:{flex:1,background:'transparent',border:'1px solid #1B6E3C',color:'#2EA55A',padding:'8px',fontFamily:'Space Mono,monospace',fontSize:10,cursor:'pointer',textTransform:'uppercase'}},'Cancel')
      )
    )
  );
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function Sidebar(p){
  var od=p.tasks.filter(function(t){return t.status!=='Done'&&isOD(t.deadline);}).length;
  var m=null;for(var i=0;i<MEMBERS.length;i++){if(MEMBERS[i].name.toLowerCase()===p.user.toLowerCase()){m=MEMBERS[i];break;}}
  var nav=[{id:'dashboard',label:'Dashboard',icon:'-'},{id:'tasks',label:'Tasks',icon:'#',badge:od||0},{id:'docs',label:'Docs',icon:'D'},{id:'team',label:'Team',icon:'@'},{id:'schedule',label:'Schedule',icon:'T'}];
  return h('div',{className:'sidebar'},
    h('div',{className:'sidebar-logo',style:{padding:'20px 20px 16px',borderBottom:'2px solid #1B6E3C'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:6}},
        h('img',{src:LOGO,alt:'JC',style:{width:40,height:40,borderRadius:'50%',objectFit:'cover',border:'2px solid #FF3D8B',flexShrink:0}}),
        h('div',{className:'sidebar-logo-text'},
          h('div',{style:{fontSize:16,fontWeight:700,color:'#F0EDE8'}},'Jelly Circle'),
          h('div',{className:'mono sidebar-sub',style:{fontSize:8,color:'#2EA55A',letterSpacing:'.1em',textTransform:'uppercase'}},'Teambase')
        )
      )
    ),
    h(MeetingBlock,{meeting:p.meeting,user:p.user,onSaveMeeting:p.onSaveMeeting}),
    h('div',{className:'sidebar-nav',style:{padding:'14px 12px',flex:1}},
      h('div',{className:'mono',style:{fontSize:9,color:'#1B6E3C',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:10,paddingLeft:12}},'// Nav'),
      nav.map(function(n){
        return h('button',{key:n.id,className:'nav-btn '+(p.page===n.id?'active':''),onClick:function(){p.setPage(n.id);},style:{position:'relative'}},
          h('span',{className:'nav-btn-icon mono',style:{fontSize:13,color:p.page===n.id?'#FFE600':'#2EA55A'}},n.icon),
          h('span',{style:{fontSize:13,fontWeight:p.page===n.id?700:400,color:p.page===n.id?'#F0EDE8':'#9CA3AF',textTransform:'uppercase',letterSpacing:'.05em'}},n.label),
          n.badge>0&&h('span',{className:'nav-btn-badge',style:{marginLeft:'auto',background:'#E8251F',color:'#fff',padding:'1px 6px',fontSize:10,fontFamily:'Space Mono,monospace',fontWeight:700}},n.badge)
        );
      })
    ),
    h('div',{className:'sidebar-user',style:{borderTop:'2px solid #1B6E3C',padding:'14px 12px'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:'rgba(27,110,60,.15)',border:'1px solid #1B6E3C'}},
        h(Av,{m:m,sz:28,pics:p.pics,editable:true}),
        h('div',{style:{flex:1,minWidth:0}},
          h('div',{style:{fontSize:12,fontWeight:600,color:'#F0EDE8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.user),
          h('div',{className:'mono',style:{fontSize:9,color:'#2EA55A',textTransform:'uppercase'}},'Online')
        ),
        h('button',{className:'sign-out',onClick:p.onLogout},'Sign Out')
      )
    )
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  var s1=useState(function(){return lsGet('jc_user');}),user=s1[0],setUser=s1[1];
  var s2=useState([]),tasks=s2[0],setTasks=s2[1];
  var s3=useState({}),pics=s3[0],setPics=s3[1];
  var s10=useState([]),docs=s10[0],setDocs=s10[1];
  var s11=useState({}),profiles=s11[0],setProfiles=s11[1];
  var s4=useState(function(){try{var sv=localStorage.getItem('jc_page');return sv||'dashboard';}catch(e){return 'dashboard';}}()),page=s4[0],setPageRaw=s4[1];
  function setPage(pg){setPageRaw(pg);try{localStorage.setItem('jc_page',pg);}catch(e){}}
  var s5=useState(null),modal=s5[0],setModalRaw=s5[1];
  var s12=useState(false),drawerOpen=s12[0],setDrawerOpen=s12[1];
  var s14=useState(null),meeting=s14[0],setMeeting=s14[1];
  var s15=useState({}),schedule=s15[0],setSchedule=s15[1];
  var s6=useState(false),saving=s6[0],setSaving=s6[1];
  var s7=useState(null),toast=s7[0],setToast=s7[1];
  var s8=useState(false),loaded=s8[0],setLoaded=s8[1];
  var s9=useState(!!window.__READY),fbReady=s9[0],setFbReady=s9[1];

  useEffect(function(){
    if(window.__READY){setFbReady(true);return;}
    function h(){setFbReady(true);}
    window.addEventListener('fb-ready',h);
    return function(){window.removeEventListener('fb-ready',h);};
  },[]);

  useEffect(function(){
    if(!fbReady||!user)return;
    // Update timezone every time app opens (catches travel/location changes)
    try{
      var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
      var mm=null;
      for(var mi=0;mi<MEMBERS.length;mi++){if(MEMBERS[mi].name.toLowerCase()===user.toLowerCase()){mm=MEMBERS[mi];break;}}
      if(mm&&tz){
        gFS().setDoc(gFS().doc(gDB(),'profiles',String(mm.id)),{timezone:tz},{merge:true});
      }
    }catch(e){}
    var u5=fbSubMeeting(function(m){setMeeting(m);});
    var u6=fbSubSchedule(function(s){setSchedule(s);});
    var u1=fbSub(function(t){
      setTasks(t);
      setLoaded(true);
      // Fetch profiles once after tasks load (non-blocking)
      try{
        var fs=gFS();
        fs.getDocs(fs.collection(gDB(),'profiles')).then(function(snap){
          var p={};
          snap.docs.forEach(function(d){p[String(d.id)]=d.data();});
          setProfiles(p);
        }).catch(function(){});
      }catch(e){}
    });
    var u2=fbSubPics(function(pp){setPics(pp);});
    var u3=fbSubDocs(function(d){setDocs(d);});
    return function(){u1();u2();u3();if(u4)u4();if(u5)u5();if(u6)u6();};
  },[fbReady,user]);

  function showToast(msg){setToast(msg);setTimeout(function(){setToast(null);},2500);}
  function login(n){lsSet('jc_user',n);setUser(n);}
  function logout(){lsSet('jc_user',null);setUser(null);setTasks([]);setLoaded(false);}

  // Lock/unlock body scroll when modal opens/closes on mobile
  function lockScroll(){document.body.style.overflow='hidden';}
  function unlockScroll(){document.body.style.overflow='';}

  function setModal(val){setModalRaw(val);if(val!==null){lockScroll();}else{unlockScroll();}}
  function openDrawer(){setDrawerOpen(true);if(window.innerWidth<=768){lockScroll();}}
  function closeDrawer(){setDrawerOpen(false);unlockScroll();}

  function saveTask(task){
    setSaving(true);
    var existing=null;
    if(task.id){for(var i=0;i<tasks.length;i++){if(tasks[i].id===task.id){existing=tasks[i];break;}}}
    var pr=existing?fbUpd(task):fbAdd(task);
    pr.then(function(){showToast(existing?'Task updated':'Task created');setModal(null);})
      .catch(function(e){console.error(e);showToast('Error saving');})
      .finally(function(){setSaving(false);});
  }
  function deleteTask(id){
    fbDel(id).then(function(){showToast('Task deleted');setModal(null);unlockScroll();}).catch(function(e){console.error(e);showToast('Error');});
  }

  if(!user)return h(Login,{onLogin:login});
  if(!fbReady||!loaded)return h('div',{style:{minHeight:'100vh',background:'#0D1117',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}},
    h('div',{className:'spinner'}),
    h('p',{className:'mono',style:{color:'#2EA55A',fontSize:12,letterSpacing:'.1em'}},!fbReady?'// CONNECTING...':'// LOADING...')
  );

  var ce=canEdit(user,modal);
  return h('div',{className:'app-wrap'},
    h(Sidebar,{page:page,setPage:setPage,tasks:tasks,user:user,onLogout:logout,pics:pics,meeting:meeting,onSaveMeeting:fbSaveMeeting}),
    h(Drawer,{open:drawerOpen,onClose:closeDrawer,page:page,setPage:setPage,tasks:tasks,user:user,onLogout:logout,pics:pics,meeting:meeting,onSaveMeeting:fbSaveMeeting,overdueCount:tasks.filter(function(t){return t.status!=='Done'&&isOD(t.deadline);}).length}),
    h('div',{className:'main-col'},
      h(MobileBar,{onOpen:openDrawer,onDash:function(){setPage('dashboard');},overdueCount:tasks.filter(function(t){return t.status!=='Done'&&isOD(t.deadline);}).length}),
      h(Ticker,{tasks:tasks}),
      h('div',{className:'main-scroll'},
        page==='dashboard'&&h(Dashboard,{tasks:tasks,onNew:function(){setModal({});},pics:pics}),
        page==='tasks'&&h(Tasks,{tasks:tasks,onNew:function(){setModal({});},onEdit:function(t){setModal(t);},pics:pics}),
        page==='team'&&h(Team,{tasks:tasks,pics:pics,user:user,profiles:profiles}),
        page==='schedule'&&h(Schedule,{user:user,schedule:schedule,onSave:fbSaveSchedule,meeting:meeting}),
        page==='docs'&&h(Docs,{docs:docs,user:user})
      )
    ),
    modal!==null&&h(TaskModal,{task:modal,onClose:function(){setModal(null);},onSave:saveTask,onDelete:deleteTask,user:user,saving:saving,pics:pics,canEdit:ce}),
    toast&&h(Toast,{msg:toast})
  );
}

// Mount
var root=document.getElementById('root');
ReactDOM.createRoot(root).render(h(App,null));
</script>
</body>
</html>
